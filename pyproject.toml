[project]
name = "openmymemo"
version = "0.2.7"
description = "Your AI memory as a local folder: any model can read it over MCP, every change needs your approval."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MyMemo", email = "leo@mymemo.ai" }]
keywords = ["memory", "mcp", "llm", "claude", "chatgpt", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.140",
    "uvicorn>=0.50",
    "typer>=0.27",
    "pyyaml>=6.0",
    "websockets>=15",
    "cryptography>=48",
    "httpx2>=2.13",
]

[project.scripts]
openmymemo = "openmymemo.cli:main"

[project.urls]
Homepage = "https://github.com/MyMemoAI/openmymemo"
Repository = "https://github.com/MyMemoAI/openmymemo"
Documentation = "https://github.com/MyMemoAI/openmymemo/blob/main/docs/MEMORY_FORMAT.md"
Issues = "https://github.com/MyMemoAI/openmymemo/issues"
Changelog = "https://github.com/MyMemoAI/openmymemo/releases"

[project.optional-dependencies]
semantic = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmymemo"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/.vite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
