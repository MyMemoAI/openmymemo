<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMyMemo</title>
<style>
  /* Shown while the app starts its local server; main.rs fills in the status. Same tokens as the panel. */
  :root { --ground: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --track: rgb(0 0 0 / 0.08); --accent: #0071e3; --danger: #c0392b; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #1e1e1f; --ink: #f5f5f7; --muted: #98989d; --track: rgb(255 255 255 / 0.12); --accent: #0a84ff; --danger: #ff6961; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; background: var(--ground); color: var(--ink);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 380px; padding: 0 24px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  .bar { width: 160px; height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  body.error .bar { display: none; }
  button {
    display: none; min-height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: default;
  }
  body.error button { display: inline-flex; align-items: center; }
  body.error #status { color: var(--danger); }
  #detail { font-size: 12px; }
</style>
</head>
<body>
  <div data-tauri-drag-region style="position: fixed; inset: 0 0 auto 0; height: 52px"></div>
  <main>
    <img src="icon.png" alt="">
    <h1>OpenMyMemo</h1>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p id="status" role="status">Starting…</p>
    <p id="detail"></p>
    <button type="button" id="choose">Choose another folder…</button>
  </main>
  <script>
    window.__setStatus = (status, detail, error) => {
      document.getElementById("status").textContent = status;
      document.getElementById("detail").textContent = detail || "";
      document.body.classList.toggle("error", !!error);
    };
    // When the memory folder can't be used, pick another one; the app restarts on it (main.rs choose_vault).
    const choose = async () => {
      try {
        await window.__TAURI_INTERNALS__.invoke("choose_vault");
      } catch (e) {
        window.__setStatus("That folder can't be used", String(e), true);
      }
    };
    document.getElementById("choose").addEventListener("click", choose);
    // Settings… (⌘,) in the menu: the folder is the setting there is before the panel opens.
    window.addEventListener("openmymemo:command", (e) => e.detail === "settings" && choose());
  </script>
</body>
</html>
