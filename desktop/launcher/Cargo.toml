[package]
name = "openmymemo-launcher"
version = "0.1.0"
description = "The openmymemo command AI apps run on Windows, installed by the OpenMyMemo app"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "openmymemo-launcher"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
