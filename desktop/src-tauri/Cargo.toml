[package]
name = "openmymemo-desktop"
version = "0.2.9"
description = "OpenMyMemo for Mac: your AI memory folder, its panel and a menu-bar item"
authors = ["MyMemo <leo@mymemo.ai>"]
license = "Apache-2.0"
repository = "https://github.com/MyMemoAI/openmymemo"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "openmymemo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Plain HTTP to 127.0.0.1 only, so no TLS.
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
