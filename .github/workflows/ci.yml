name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux tests the oldest and newest Python we support, macOS (Apple silicon and Intel) the middle one together with
# the Mac app, Windows the middle one too (and the Windows app in a job of its own), and the panel job checks the
# committed build and packs the extension.
jobs:
  linux:
    name: Python tests (Linux, 3.11 and 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen --python 3.13 ruff check src tests scripts
      - name: Tests on Python 3.11
        run: uv run --frozen --python 3.11 pytest
      - name: Tests on Python 3.13
        run: uv run --frozen --python 3.13 pytest

  macos:
    name: macOS tests and Mac app (Python 3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv run --frozen pytest
      - run: python3 scripts/stage_desktop.py  # the bundled core and uv, which the Tauri build checks for
      - run: cargo test --locked
        working-directory: desktop/src-tauri

  macos-intel:
    # The Intel disk image's core (cryptography 48 there, no ONNX Runtime) and the app, on GitHub's Intel runner.
    name: Intel Mac tests and Mac app (Python 3.12)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv run --frozen pytest
      - uses: actions/cache@v4
        with:
          path: ~/.cache/openmymemo-models
          key: models-${{ hashFiles('src/openmymemo/recall/model_pins.json') }}
      - name: The local embedding models with ONNX Runtime 1.23, the last for Intel Macs
        run: |
          uv run --frozen --with onnxruntime --with tokenizers python scripts/check_local_models.py ~/.cache/openmymemo-models
      - run: python3 scripts/stage_desktop.py
      - run: cargo test --locked
        working-directory: desktop/src-tauri

  windows:
    # The Python core on Windows (uvx, the AI apps' plugins). Failing tests are printed as annotations.
    name: Windows tests (Python 3.12)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Tests (a failing test is also printed as an annotation)
        # The tests read and write their fixtures in the platform's default encoding, which on Windows isn't
        # UTF-8; the package itself always names its encoding.
        env:
          PYTHONUTF8: "1"
        run: |
          status=0
          uv run --frozen pytest --junitxml=report.xml || status=$?
          if [ "$status" -ne 0 ]; then
            uv run --frozen python scripts/annotate_failures.py report.xml || true
          fi
          exit "$status"

  windows-app:
    # The Windows app: its tests and the launcher's, then the installer (unsigned), kept for a week to try out.
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: python scripts/stage_desktop.py  # the bundled core, uv and launcher, which the Tauri build checks for
      - run: cargo test --locked
        working-directory: desktop/launcher
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      # No updater key here: the installer is built without its signed update file.
      - run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with:
          name: openmymemo-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  panel:
    name: Panel build and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build  # type-checks with vue-tsc first
        working-directory: web
      - run: pnpm test
        working-directory: web
      - name: src/openmymemo/static matches web/
        run: |
          if [ -n "$(git status --porcelain src/openmymemo/static)" ]; then
            git status --short src/openmymemo/static
            echo "::error::The committed panel build is out of date. Run 'cd web && pnpm build' and commit src/openmymemo/static."
            exit 1
          fi
      - run: uv run --frozen python scripts/build_mcpb.py  # validates the manifest
      - uses: actions/upload-artifact@v7
        with:
          name: openmymemo-mcpb
          path: dist/*.mcpb
          if-no-files-found: error
