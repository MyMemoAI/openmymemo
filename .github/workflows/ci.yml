name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run ruff check src tests scripts

  panel:
    name: Panel build is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build  # type-checks with vue-tsc first
        working-directory: web
      - run: pnpm test
        working-directory: web
      - name: src/openmymemo/static matches web/
        run: |
          if [ -n "$(git status --porcelain src/openmymemo/static)" ]; then
            git status --short src/openmymemo/static
            echo "::error::The committed panel build is out of date. Run 'cd web && pnpm build' and commit src/openmymemo/static."
            exit 1
          fi

  desktop:
    name: Mac app tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: python3 scripts/stage_desktop.py  # the bundled core and uv, which the Tauri build checks for
      - run: cargo test --locked
        working-directory: desktop/src-tauri

  extension:
    name: Claude Desktop extension packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv run --frozen python scripts/build_mcpb.py  # validates the manifest
      - uses: actions/upload-artifact@v7
        with:
          name: openmymemo-mcpb
          path: dist/*.mcpb
          if-no-files-found: error
