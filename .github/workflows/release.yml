name: Release

# Push a tag named after the version (v0.2.2) to publish the Mac and Windows apps, the Claude Desktop extension and the
# Python package as a GitHub release, the Python package on PyPI, and server.json on the MCP Registry. The version
# must already be bumped everywhere (tests/test_packaging.py).
# The release is created once every file is built, so it never lacks the disk image; if a job fails, nothing
# is published and "Re-run failed jobs" picks up from there.
on:
  push:
    tags: ["v*"]

# Only the job that publishes can write; the Mac build runs many build scripts next to the signing secrets.
permissions:
  contents: read

jobs:
  mac:
    name: Mac app (${{ matrix.arch }})
    # Builds OpenMyMemo-<version>-arm64.dmg for Apple silicon and OpenMyMemo-<version>-x86_64.dmg for Intel, each
    # natively on a runner of that architecture, so the uv that stage_desktop.py bundles is the right one too.
    # GitHub's Intel macOS runner (macos-15-intel) is supported until fall 2027.
    # With these repository secrets the app is signed with a Developer ID and notarized; without them (a fork) it
    # is signed ad hoc, and macOS asks once to open it (README).
    #   APPLE_CERTIFICATE           the "Developer ID Application" certificate and its key as a .p12, base64
    #   APPLE_CERTIFICATE_PASSWORD  the .p12's password
    #   APPLE_SIGNING_IDENTITY      the certificate's name: "Developer ID Application: <Company> (<Team ID>)"
    #   APPLE_API_ISSUER            notarization with an App Store Connect API key: the issuer id,
    #   APPLE_API_KEY_ID            the key id,
    #   APPLE_API_PRIVATE_KEY       and the text of the key's .p8 file
    #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
    #                               optional: notarization with an Apple ID and an app-specific password,
    #                               used only when the API key secrets are absent
    # Tauri reads the APPLE_* variables itself (tauri-apps/tauri, crates/tauri-bundler/src/bundle/macos/sign.rs):
    # it imports the certificate into a temporary keychain, and APPLE_SIGNING_IDENTITY overrides the ad hoc
    # "signingIdentity": "-" in tauri.conf.json (crates/tauri-cli/src/interface/rust.rs).
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7; stage_desktop.py bundles this uv
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build the app and the disk image
        working-directory: desktop
        env:
          # CI=true also makes Tauri skip the Finder scripting that lays out the disk image window.
          CI: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A missing secret arrives as an empty variable, which Tauri would take as set.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER \
                      APPLE_API_KEY APPLE_API_PRIVATE_KEY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::No Developer ID certificate in the secrets: the app is signed ad hoc and not notarized."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY \
                  APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          elif [ -n "${APPLE_API_PRIVATE_KEY:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            # Tauri would use APPLE_ID first if it were set; the API key is the one to use.
            unset APPLE_ID APPLE_PASSWORD
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            ( umask 077 && printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH" )
          elif [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::warning::No notarization credentials in the secrets: the app is signed but not notarized."
            unset APPLE_ID APPLE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY
          fi
          unset APPLE_API_PRIVATE_KEY
          pnpm tauri build --bundles app,dmg
      - name: Check the signature and architecture, and name the disk image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bundle=desktop/src-tauri/target/release/bundle
          app="$bundle/macos/OpenMyMemo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|Signature|TeamIdentifier)=' || true
          # The app and the uv it runs must both be built for this disk image's architecture, and only for it.
          for bin in "$app"/Contents/MacOS/*; do
            archs=$(lipo -archs "$bin")
            if [ "$archs" != "$ARCH" ]; then
              echo "::error::$bin is built for '$archs', not $ARCH."
              exit 1
            fi
          done
          dmgs=("$bundle"/dmg/OpenMyMemo_"${VERSION}"_*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "::error::Expected one disk image, found: ${dmgs[*]}"
            exit 1
          fi
          mkdir -p dist
          cp "${dmgs[0]}" "dist/OpenMyMemo-${VERSION}-${ARCH}.dmg"
          hdiutil verify "dist/OpenMyMemo-${VERSION}-${ARCH}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: openmymemo-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows app
    # Builds OpenMyMemo-<version>-x64-setup.exe, an installer for the current user that needs no administrator.
    # It isn't signed yet, so Windows SmartScreen asks once before it runs (README).
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: The tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7; stage_desktop.py bundles this uv
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build the app and the installer
        working-directory: desktop
        run: pnpm tauri build --bundles nsis
      - name: Name the installer
        run: |
          installers=(desktop/src-tauri/target/release/bundle/nsis/OpenMyMemo_"${VERSION}"_*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ] || [ ! -f "${installers[0]}" ]; then
            echo "::error::Expected one installer, found: ${installers[*]}"
            exit 1
          fi
          mkdir -p dist
          cp "${installers[0]}" "dist/OpenMyMemo-${VERSION}-x64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: openmymemo-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
      - name: The tag matches the version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml."
            exit 1
          fi
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run python scripts/build_mcpb.py
      - run: uv build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          pattern: openmymemo-dmg-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: openmymemo-windows
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.exe dist/*.mcpb dist/*.whl dist/*.tar.gz \
            --title "OpenMyMemo ${GITHUB_REF_NAME#v}" --generate-notes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: openmymemo-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  pypi:
    # The same wheel and sdist as the GitHub release, uploaded with PyPI's trusted publishing: PyPI accepts this
    # job's OIDC token, so there is no API token in the secrets. One-time setup on pypi.org: a trusted publisher
    # for MyMemoAI/openmymemo, workflow release.yml, environment pypi. If it fails after the GitHub release is
    # out, "Re-run failed jobs" runs only this job. PyPI never takes the same version twice.
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openmymemo/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: openmymemo-python
          path: dist
      - run: uv publish --trusted-publishing always dist/*

  mcp-registry:
    # Lists this version on the official MCP Registry (registry.modelcontextprotocol.io), which MCP clients and
    # other directories read. The registry stores only server.json: it checks that the PyPI package of that
    # version exists and that its README names this server ("mcp-name:" near the top of README.md), so it runs
    # after PyPI. GitHub OIDC proves the namespace io.github.MyMemoAI, so there is no token in the secrets.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: |
          # PyPI can take a minute to serve a version it has just accepted.
          for wait in 0 30 60 120; do
            sleep "$wait"
            if ./mcp-publisher publish; then exit 0; fi
          done
          exit 1
