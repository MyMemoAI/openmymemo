name: Release

# Push a tag named after the version (v0.2.2) to publish the Claude Desktop extension and the Python
# package as a GitHub release. The version must already be bumped everywhere (tests/test_packaging.py).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The tag matches the version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml."
            exit 1
          fi
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run python scripts/build_mcpb.py
      - run: uv build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.mcpb dist/*.whl dist/*.tar.gz \
            --title "OpenMyMemo ${GITHUB_REF_NAME#v}" --generate-notes
