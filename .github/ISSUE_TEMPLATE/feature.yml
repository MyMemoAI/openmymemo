name: Idea or feature request
description: Something OpenMyMemo should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: markdown
    attributes:
      value: |
        OpenMyMemo's design principles are in [docs/product-design.md](https://github.com/MyMemoAI/openmymemo/blob/main/docs/product-design.md#2-principles-the-tie-breakers-for-product-decisions): memory stays a local folder you own, AI changes are visible and undoable, open formats. Bigger changes start as a proposal that maintainers accept before anyone builds them.
